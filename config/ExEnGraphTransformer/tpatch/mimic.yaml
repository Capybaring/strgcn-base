global_config:
  task_name: prediction
  tpatch_data_root: ./data/tpatch-data
data_config:
  data_processor_name: TPatchRecordProcessor
  scaler_name: TPatchInputScaler
  scaler_params: {}
  dataset_name: TPatchRecordDataset
  dataset_params:
    known_future_exogenous_var_ids: all
    pack_attention: true
  dataloader_params:
    shuffle: true
    num_workers: 0
    pin_memory: false
    drop_last: false
  data_processor_params:
    dataset: mimic
    split_seed: 42
model_config:
  model_name: ExEnGraphTransformer
  model_params:
    c_in: 1
    c_out: 1
    hid_dim: 32
    node_dim: 16
    n_layer: 4
    dropout: 0.3
    use_norm: true
    time_embedding_type: rbf
    receiver_chunk_size: 512
    n_cross_layer: 3
    num_heads: 4
    ffn_multiplier: 2
    attention_backend: sdpa
    attention_dtype: float32
    attention_dropout: 0.0
    use_time_bias: true
    use_variable_bias: true
    time_bias_init: 1.0
    variable_bias_init: 0.01
    checkpoint_attention: false
train_config:
  batch_size: 32
  load_checkpoint: false
  metrics:
  - mse
  - mae
  - rmse
  random_seed: 3407
  device: cpu
  optimizer_name: Adam
  optimizer_params:
    lr: 0.003
    weight_decay: 0.0
  scheduler_name: StepLR
  scheduler_params:
    step_size: 10
    gamma: 0.5
  trainer_name: TPatchForecastTrainer
  trainer_params:
    max_epoch_num: 30
    enable_early_stop: true
    early_stop_patience: 5
    eval_metric_key: mse
    eval_metric_min_is_best: true
    enable_autocast: false
    do_inverse_scaling: false
