global_config:
  task_name: prediction
  tpatch_data_root: ./data/tpatch-data
data_config:
  data_processor_name: TPatchRecordProcessor
  scaler_name: TPatchInputScaler
  scaler_params: {}
  dataset_name: MTANQueryDataset
  dataset_params:
    known_future_exogenous_var_ids: all
    patch_size: 300
    backbone_history: y
  dataloader_params:
    shuffle: true
    num_workers: 0
    pin_memory: false
    drop_last: false
  data_processor_params:
    dataset: activity
    split_seed: 42
model_config:
  model_name: LatentODEQueryFusion
  model_params:
    fusion_mode: v1
    fusion_hidden: 64
    plugin_hidden: 32
    plugin_heads: 4
    hid_dim: 40
    latent_dim: 20
    ode_hidden: 100
    rec_layers: 1
    gen_layers: 1
    gru_units: 100
    kl_weight: 0.001
    ode_rtol: 0.001
    ode_atol: 0.0001
train_config:
  batch_size: 32
  load_checkpoint: false
  metrics:
  - mse
  - mae
  - rmse
  random_seed: 3407
  device: cpu
  optimizer_name: Adam
  optimizer_params:
    lr: 0.001
    weight_decay: 0.0
  scheduler_name: StepLR
  scheduler_params:
    step_size: 1000000
    gamma: 1.0
  trainer_name: TPatchForecastTrainer
  trainer_params:
    max_epoch_num: 30
    enable_early_stop: true
    early_stop_patience: 5
    eval_metric_key: mse
    eval_metric_min_is_best: true
    enable_autocast: false
    do_inverse_scaling: false
