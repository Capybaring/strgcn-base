data_config:
  data_processor_name: ExEnProcessedProcessor
  data_processor_params:
    forecast_len: 1800
    history_len: 7200
    split_ratios:
    - 0.6
    - 0.2
    - 0.2
    target_names:
    - FIC05.PV
    - FIC09.PV
    - FIC11.PV
    - LIC02.PV
    - LIC03.PV
    - LIC04.PV
    - LIC05.PV
    - LIC06.PV
    - LIC12.PV
  dataloader_params:
    drop_last: false
    num_workers: 0
    pin_memory: false
    shuffle: true
  dataset_name: TPatchFusionDataset
  dataset_params:
    known_future_exogenous_var_ids: all
    patch_size: 60
  scaler_name: ExEnProcessedMinMaxScaler
  scaler_params: {}
global_config:
  exen_data_path: ./data/processed/DIST.npz
  task_name: prediction
model_config:
  model_name: HiPatchFusion
  model_params:
    hid_dim: 32
    n_layer: 1
    n_heads: 1
    fusion_hidden: 64
train_config:
  batch_size: 1
  device: cpu
  load_checkpoint: false
  metrics:
  - mse
  - mae
  - rmse
  optimizer_name: Adam
  optimizer_params:
    lr: 0.001
    weight_decay: 0.0
  random_seed: 3407
  scheduler_name: StepLR
  scheduler_params:
    step_size: 1000000
    gamma: 1.0
  trainer_name: TPatchForecastTrainer
  trainer_params:
    do_inverse_scaling: false
    early_stop_patience: 5
    enable_autocast: false
    enable_early_stop: true
    eval_metric_key: mse
    eval_metric_min_is_best: true
    max_epoch_num: 30
